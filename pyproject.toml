[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runway"
version = "0.1.0"
description = "Static HTML previews of EDSL human-survey questions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES.md"]
authors = [{ name = "Expected Parrot" }]
keywords = ["edsl", "survey", "preview", "html"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Markup :: HTML",
]
# Deliberately short. The linkify extra is not optional: markdown-it's
# `gfm-like` preset raises ModuleNotFoundError without it rather than quietly
# leaving bare URLs unlinked.
dependencies = [
  "Jinja2>=3.1",
  "markdown-it-py[linkify]>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
runway = "runway.cli:main"

[project.urls]
Homepage = "https://github.com/expectedparrot/runway"
Source = "https://github.com/expectedparrot/runway"

# templates/ and assets/ live inside the package directory, so hatchling ships
# them with it. They are not decoration: a wheel without them renders nothing,
# which tests/test_packaging.py is there to catch.
[tool.hatch.build.targets.wheel]
packages = ["src/runway"]

[tool.hatch.build.targets.sdist]
include = [
  "src/runway",
  "tests",
  "examples",
  "README.md",
  "LICENSE",
  "LICENSES.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# `goldens` is a sibling module inside tests/, not a dependency -- it belongs in
# the same import block as the package under test.
known-first-party = ["runway", "goldens"]
