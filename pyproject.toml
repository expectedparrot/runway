[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runway"
version = "0.1.0"
description = "Static HTML previews of EDSL human-survey questions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES.md"]
authors = [{ name = "Expected Parrot" }]
keywords = ["edsl", "survey", "preview", "html"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Markup :: HTML",
]
# The linkify extra is not optional: markdown-it's `gfm-like` preset raises
# ModuleNotFoundError without it rather than quietly leaving bare URLs
# unlinked.
#
# edsl is tracked from git main rather than a release. Two consequences worth
# knowing before changing it: this project cannot be uploaded to PyPI while a
# direct URL reference is in this list, and installing requires git and network
# access. `uv.lock` pins the commit, so a locked install is still reproducible.
dependencies = [
  "Jinja2>=3.1",
  "markdown-it-py[linkify]>=3.0",
  "edsl @ git+https://github.com/expectedparrot/edsl.git@main",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
runway = "runway.cli:main"

[project.urls]
Homepage = "https://github.com/expectedparrot/runway"
Source = "https://github.com/expectedparrot/runway"

# templates/ and assets/ live inside the package directory, so hatchling ships
# them with it. They are not decoration: a wheel without them renders nothing,
# which tests/test_packaging.py is there to catch.
# Required for the edsl dependency: hatchling refuses direct URL requirements
# (`pkg @ git+https://...`) unless a project opts in.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/runway"]

[tool.hatch.build.targets.sdist]
include = [
  "src/runway",
  "tests",
  "examples",
  "README.md",
  "LICENSE",
  "LICENSES.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# `goldens` is a sibling module inside tests/, not a dependency -- it belongs in
# the same import block as the package under test.
known-first-party = ["runway", "goldens"]
